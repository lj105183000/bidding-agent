<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="招采智脑 logo">
  <!--
    招采智脑 Logo
    ============
    语义构成（为什么是这些形状）：
      · 圆角方块 + 品牌蓝渐变      应用图标基底，贴合移动端启动图与 favicon
      · 白色文稿（带折角）          **采购文件 / 招标文书** —— 本产品的处理对象
      · 浅蓝法槌（槌头 + 槌柄）      **评标定标 / 异议裁定** —— 本项目知识库的核心主题
      · 右上双尖星                  **智能（AI）** —— 呼应"大模型驱动"的定位

    ★ 为什么不是「盾牌」或「天平」
    ------------------------
    盾牌偏"合规审计"、天平偏"司法"。本产品的核心动作是**裁决一份采购文件是否成立**，
    法槌比两者都更贴近"评标定标"，且形状在 16px 下仍可辨识。

    ★ 三个设计决定都是渲染对比后定的（不是凭读代码）
    ------------------------------------------
    本项目有过一次同类教训：Tailwind 写了不存在的色阶 `brand-400`，类名静默不生成、
    进度条全透明，**只有看渲染结果才能发现**。故 logo 也做了多轮渲染对比：

    ① **文稿上不放文字线**。初版放了 3 条浅蓝线模拟正文，渲染后发现在 16/24px 下
       糊成噪点、反而降低清晰度。去掉后小尺寸是干净的白色块面，更易辨识。
    ② **法槌用浅蓝 `#DBEAFE` 而非深蓝 `#2563EB`**。深蓝叠在同色系背景上只靠
       明度差区分，小尺寸下发闷；浅蓝明显提亮，且不与白色文稿抢焦点。
    ③ **法槌下移、与文稿脱开**。初版槌柄顶端几乎碰到文稿，显得局促；
       脱开后形成"纸 + 槌"两个独立块面。

    ★ 固定色值而非 currentColor
    ----------------------
    favicon 场景没有 CSS 上下文，`currentColor` 会退化成黑色。
    故所有颜色写死为 tailwind.config.js 里 brand 色板的值，保证两处一致：
        #3B82F6 = brand-500    #1D4ED8 = brand-700
        #2563EB = brand-600    #DBEAFE = brand-100
  -->
  <defs>
    <linearGradient id="zcnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- 底座 -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#zcnBg)"/>

  <!-- 文稿。折角用**画上去的三角形**而不是"白矩形 + 蓝三角形"叠加：
       后者会在顶部圆角处露出一小块蓝色三角，像渲染错误。 -->
  <path d="M14 12 H36 L46 22 V45 H14 Z" fill="#FFFFFF"/>
  <path d="M36 12 L46 22 H36 Z" fill="#DBEAFE"/>

  <!-- 法槌：槌头 + 槌柄，整体旋转 -45°。
       两条 rect 的旋转中心都取自身中心（x+w/2, y+h/2），保证绕自己转、
       不会因取错中心而漂移。 -->
  <rect x="40" y="24.8" width="18" height="4.8" rx="2.4" fill="#DBEAFE"
        transform="rotate(-45 49 27.2)"/>
  <rect x="40" y="41.6" width="18.9" height="5.2" rx="2.6" fill="#DBEAFE"
        transform="rotate(-45 49.45 44.2)"/>

  <!-- 智能：双尖星。用二次贝塞尔画凹边，四角对称 -->
  <path d="M50 7 Q52 13.5 58.5 15.5 Q52 17.5 50 24 Q48 17.5 41.5 15.5 Q48 13.5 50 7 Z"
        fill="#FFFFFF"/>
</svg>
