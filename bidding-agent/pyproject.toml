[project]
name = "bidding-agent"
version = "0.1.0"
description = "招投标采购 Agent：RAG + 知识图谱 + 数据库 + 联网搜索的智能问答系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web 框架层
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.13.4",
    # LLM 接入
    "openai>=2.48.0",
    "zai-sdk>=0.2.3",
    # 数据存储
    "qdrant-client>=1.18.0",
    "neo4j>=6.2.0",
    "sqlalchemy>=2.0.51",
    "psycopg[binary]>=3.3.4",
    # 检索与模型
    "sentence-transformers>=5.6.1",
    "jieba>=0.42.1",
    # 联网搜索
    "tavily-python>=0.7.27",
    # 数据处理
    "pandas>=3.0.5",
    "openpyxl>=3.1.5",
    # 通用
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
# 骨架阶段先作为非打包项目运行；模块落地后如需要可改为打包布局
package = false

[[tool.uv.index]]
# 国内镜像，按需保留
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
