# CI 流水线：push 到 main 与所有 PR 自动执行，也可手动触发（workflow_dispatch）。
# 测试依赖根 conftest.py 预置的必需 env，不需要仓库里存在 .env 或真实密钥（开发文档 §14.1）。
# 合并规则要求「CI 测试全绿 + 至少 1 人 review」才能合入 main（分配说明 §1.3）。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送会取消还在跑的旧运行，节省 Actions 配额
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试（uv + pytest，含依赖约束校验）
    runs-on: ubuntu-latest
    # 后端工程在 bidding-agent/ 子目录（仓库根没有 pyproject.toml），
    # 不钉 working-directory 的话 uv sync --frozen 在根目录找不到工程直接失败
    defaults:
      run:
        working-directory: bidding-agent
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 固定 Python 3.12（与 pyproject requires-python 一致）；
      # setup-uv 默认开启 uv 缓存，依赖不变时 uv sync 只需秒级
      - name: 安装 uv 与 Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          # 与 uv.lock（revision 5）对齐：uv 版本漂移会让 lock --check 误判
          version: "0.13.3"
          python-version: "3.12"

      # 软件包约束①：uv.lock 必须满足 pyproject.toml 声明的版本约束（如 openai <3.0.0 上界），
      # 锁定的解析结果与声明不符则 --check 直接失败，不给过。
      - name: 校验依赖约束（uv lock --check）
        run: uv lock --check

      # --frozen 只按 uv.lock 安装：保证 CI 与本地依赖完全一致，
      # 谁改了依赖但忘了提交 lock 文件会在这里失败，而不是悄悄装出不同环境
      - name: 同步依赖（按 uv.lock 锁定）
        run: uv sync --frozen

      - name: 运行测试
        # ★ 加覆盖率与最慢用例，并显式排除 integration
        #
        # 三个改动的理由（都是实测咬过人的）：
        #
        # `--cov` —— 此前**完全没有覆盖率度量**。实测基线 71%，缺口集中在
        #   `to_postgresql/to_neo4j/vision`（0%）与 `api/server.py`（36%）。
        #   **不设 `--cov-fail-under`**：本次只做"让数字可见"，
        #   定阈值需要先看几轮趋势，否则会变成"为了过门禁而写测试"。
        #
        # `--durations=10` —— 一眼看出哪几个用例在拖。实测最慢单个 16s
        #   （含嵌入模型加载的集成用例）。
        #   注：它**不能配在 pyproject 的 ini 里**（pytest 会报
        #   `Unknown config option: durations` 然后静默忽略），只能命令行传。
        #
        # `-m "not integration"` —— 本来已由 `addopts` 默认生效，这里**显式写出**
        #   是为了让 CI 日志里能直接看到这个口径，不必去翻 pyproject。
        run: |
          uv run pytest -q \
            -m "not integration" \
            --durations=10 \
            --cov=src --cov=api \
            --cov-report=term-missing:skip-covered

      # 覆盖率报告存档：失败时也能下载下来看缺口的分布
      # （`if: always()` —— 测试红了正是最需要看覆盖率的时候）
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: bidding-agent/.coverage
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: 前端构建与测试（npm ci + build + vitest）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 固定 Node 20 并缓存 npm：package-lock.json 不变时 npm ci 只需秒级
      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 软件包约束②：npm ci 只按 frontend/package-lock.json 安装，
      # package.json 与 lock 不一致（如手改依赖忘了跑 npm install）会直接失败，不给过。
      - name: 校验前端依赖约束（npm ci）
        run: npm ci
        working-directory: frontend

      - name: 类型检查与构建（tsc -b && vite build）
        run: npm run build
        working-directory: frontend

      - name: SSE 解析器单测（vitest run）
        run: npm run test
        working-directory: frontend
