# 分线评测门禁：**每条评测线一个 job**，谁挂了谁单独红。
#
# ★ 位置很要紧：必须在**仓库根**的 `.github/workflows/`
#   GitHub Actions 只读仓库根，放在 `bidding-agent/.github/` 下
#   永远不会被执行（这份文件原来就在那里，且未被 git 跟踪）。
#
# ★ 为什么单独一个文件（不改 ci.yml）
# ================================
# `ci.yml` 只跑单测（纯离线、几十秒）。评测线要连真实服务
# （Qdrant + LLM），成本与依赖完全不同，混进主 CI 会让"提交即红"
# 变成常态，久而久之没人看。故拆成独立工作流，**手动触发**。
#
# ★ 分线红怎么做到
# ==============
# 门禁早已输出"分线结论"，但退出码只有一个（0/1/2）。本工作流用
# `--suites <线> --gate --fail-on <线>` 把判定范围收窄到**一条线**：
# 每条线一个 matrix job，于是 GitHub 上直接显示
# "eval / agent ✅、eval / retrieval ❌、eval / rag ✅"。
#
#   实测语义（见 `eval/trend.decide_exit_code` 的文档）：
#     --fail-on X   只有 X 的未达标/退化会让退出码非零；
#                   其它线的问题**照常打印**并在 `ignored_suites` 里点名
#     --allow-fail X  除 X 外都算数（探索线的常见用法）
#   两者互斥；写错线名会**直接报错**（而不是静默永远绿）。
#
# ★ 前置条件（不满足时该线记 NOT_RUN，**不会**让门禁失败）
# ==================================================
#   1. 仓库 Secrets：DEEPSEEK_API_KEY、ZHIPU_API_KEY（裁判模型）、
#      QDRANT_URL、QDRANT_API_KEY
#   2. 知识库已 ingest（否则检索/RAG 线测的是空库，分数没有意义）
#   3. 首次运行没有基线 → 只存档并返回 0；第二次起才有得比
#      （门禁输出里会写"分线基线：rag ⏳ 无基线"并给出建立命令）
#
# 需要本地跑同样的东西：
#   python eval/run_all.py --suites agent --gate --fail-on agent --save

name: Eval Gate

on:
  workflow_dispatch:
    inputs:
      suites:
        description: "要跑的线（逗号分隔；留空=全部）"
        required: false
        default: ""
      save:
        description: "是否把本次结果存进趋势文件（建立/更新基线）"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # ★ 评测工程在 `bidding-agent/` 子目录（仓库根没有 pyproject.toml）。
  #   这份工作流原先放在 `bidding-agent/.github/workflows/`，那时相对路径
  #   是 `eval/run_all.py`。移到仓库根后必须显式钉工作目录，
  #   否则 `uv sync` 在根目录找不到工程直接失败。
  # 先问运行器"有哪些线"，再据此生成 matrix —— 新增评测线时
  # 只需改 `eval/run_all.ALL_SUITES`，工作流不用动。
  # 例外：retrieval_offline 由独立的 retrieval-offline-gate.yml 覆盖，
  # 在下面的 list 步骤里显式过滤，避免重复下载 HF 模型。
  plan:
    name: 评测线清单
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bidding-agent
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.3"
          python-version: "3.12"
      - name: 同步依赖
        run: uv sync --frozen
      - id: list
        name: 取评测线清单
        env:
          # 空 = 全部；逗号分隔可只跑子集。旧版声明了这个输入却没接进 matrix。
          REQUESTED_SUITES: ${{ github.event.inputs.suites }}
        run: |
          SUITES=$(uv run python eval/run_all.py --list-suites | python -c "
          import json, os, sys
          suites = json.load(sys.stdin)['suites']
          requested = [
              s.strip() for s in os.environ.get('REQUESTED_SUITES', '').split(',')
              if s.strip()
          ]
          unknown = [s for s in requested if s not in suites]
          if unknown:
              sys.exit(f'未知评测线：{unknown}（可选：{suites}）')
          if requested:
              suites = [s for s in suites if s in requested]
          # retrieval_offline 由独立的 retrieval-offline-gate.yml 覆盖：
          # 它不需要 Secrets，但要 HF 模型缓存；放在这里会让本工作流的
          # 每条线都重复下载模型，且与 PR 门禁的触发条件不一致。
          suites = [s for s in suites if s != 'retrieval_offline']
          if not suites:
              sys.exit('没有可跑的评测线（retrieval_offline 请用 retrieval-offline-gate.yml）')
          print(json.dumps(suites))
          ")
          echo "matrix={\"suite\":$SUITES}" >> "$GITHUB_OUTPUT"
          echo "评测线：$SUITES"

  gate:
    name: "eval / ${{ matrix.suite }}"
    needs: plan
    runs-on: ubuntu-latest
    # agent 线需要 Postgres；用 job 内 service 容器，runner 内通过 localhost:5432 访问。
    # 不复用仓库 Secrets 里的本地/内网库（GitHub 托管 runner 不可达）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # RAG 线 40 题约 15–20 分钟；60 分钟足够，且能拦住挂死
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bidding-agent
    env:
      # 固定缓存目录，便于 actions/cache 命中；与 retrieval-offline-gate 共用同一份
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_ENDPOINT: https://hf-mirror.com
    # 每条线独立失败：一条挂了不影响其它线跑完（这正是"分线红"的意义）
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.3"
          python-version: "3.12"
      - name: 同步依赖
        run: uv sync --frozen
      # ★ 趋势文件必须**按线隔离**缓存：三个 matrix job 并发时若共用同一个
      #   key，actions/cache 只会保留最先保存的那份，其余线的基线被静默覆盖。
      - name: 恢复趋势文件（按线）
        # 用 cache/restore 而不是 cache：避免在成功时自动保存，
        # 下面用显式 cache/save 保证**门禁失败时也保存**新基线。
        uses: actions/cache/restore@v4
        with:
          path: bidding-agent/eval/trend.jsonl
          key: eval-trend-${{ github.ref_name }}-${{ matrix.suite }}-${{ github.run_id }}
          restore-keys: |
            eval-trend-${{ github.ref_name }}-${{ matrix.suite }}-
            eval-trend-${{ github.ref_name }}-
      # ★ 模型必须先缓存/预热：门禁步骤设置了 HF_HUB_OFFLINE=1。
      #   缓存未命中且不预热时，模型加载失败会变成 NOT_RUN —— 而 NOT_RUN
      #   不参与 --fail-on 判定，工作流会"静默变绿"。
      - name: 恢复 HF 模型缓存
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-bge-small-zh-v1.5-v1
          restore-keys: hf-bge-small-zh-v1.5-
      - name: 预热嵌入模型（失败即红）
        run: |
          uv run python -c "from src.rag.embedder import Embedder; print(len(Embedder().encode_query('预热')))"
      - name: 跑 ${{ matrix.suite }} 线并门禁
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          # 实际集合名是 bid_qa；不传会回落到默认的 bidding_qa（不存在）
          QDRANT_COLLECTION: bid_qa
          # 图谱工具需要 Neo4j；缺配置会走降级文案，agent 指标会明显失真。
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          # agent 线构造 Settings 时会校验 Postgres 配置。
          # 用本 job 的 service 容器，避免依赖 runner 无法访问的 localhost/内网库。
          POSTGRES_HOST: localhost
          POSTGRES_DB: chatbot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          HF_HUB_OFFLINE: "1"
          # 核对失败时做一轮定向修复；agent 质量门禁需要它消除偶发的条款号/数字编造
          AGENT_VERIFY_REPAIR: "1"
          # agent 线 37 题，单题翻转 ≈2.7%；2% 容差会把正常抖动误判为退化。
          # agent 放宽到 5%，其它线保持 2%。
          GATE_TOLERANCE: ${{ matrix.suite == 'agent' && '0.05' || '0.02' }}
        run: |
          uv run python eval/run_all.py \
            --suites ${{ matrix.suite }} \
            --gate \
            --fail-on ${{ matrix.suite }} \
            --tolerance $GATE_TOLERANCE \
            --gate-json gate-${{ matrix.suite }}.json \
            ${{ (github.event.inputs.save == 'true') && '--save' || '' }}
      # ★ NOT_RUN 的退出码是 0（"没测"不等于"没通过"），若只看退出码会漏掉
      #   "模型/依赖挂了但工作流全绿"。这里显式校验该线确实跑过。
      - name: 校验评测线确实执行
        if: always()
        run: |
          uv run python -c "
          import json, sys
          suite = '${{ matrix.suite }}'
          detail = json.load(open(f'gate-{suite}.json', encoding='utf-8'))
          if suite not in detail.get('ran_suites', []):
              sys.exit(f'{suite} 未执行（NOT_RUN），门禁结果无效')
          print('评测线已执行：' + suite)
          "
      - name: 上传门禁决策
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.suite }}
          path: bidding-agent/gate-${{ matrix.suite }}.json
          if-no-files-found: warn
      # ★ 关键：`--save` 写的新基线必须在门禁失败时也保存。
      #   否则第一次 `save=true` 因相对旧基线的退化而 exit 2，cache 后置步骤
      #   不落盘 → 下一次仍拿旧基线比较，基线永远无法更新。
      - name: 保存趋势文件（失败也保存）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bidding-agent/eval/trend.jsonl
          key: eval-trend-${{ github.ref_name }}-${{ matrix.suite }}-${{ github.run_id }}
