# 安全红线流水线：扫描提交中泄露的密钥 / .env 内容。
# 对应分配说明 §1.3 铁律「.env 和密钥永远不入库」与开发文档 §14.2 提交前检查单。
# 发现疑似密钥会直接失败，阻止合并。

name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: 密钥泄露扫描（gitleaks）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 全量历史：push 到 main 时扫描整个提交历史，而不只是新提交
          fetch-depth: 0

      - name: 运行 gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
